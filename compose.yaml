name: scorm-campus

services:
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      # Reachable only through the internal location Laravel redirects to after checking the session.
      - ${COURSES_HOST_PATH:-./storage/courses}:/var/www/courses:ro
    depends_on:
      app:
        condition: service_healthy

  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    environment:
      APP_NAME: Ուսում
      APP_ENV: ${DOCKER_APP_ENV:-production}
      APP_DEBUG: ${DOCKER_APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_LOCALE: hy
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-scorm_campus}
      DB_USERNAME: ${DB_USERNAME:-scorm}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      CACHE_STORE: database
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
      QUEUE_CONNECTION: sync
      UPLOAD_TOKEN: ${UPLOAD_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      OPENAI_TIMEOUT: ${OPENAI_TIMEOUT:-45}
      AI_QUESTION_LIMIT: ${AI_QUESTION_LIMIT:-10}
      AI_QUESTION_MAX_LENGTH: ${AI_QUESTION_MAX_LENGTH:-100}
      AI_MAX_CHUNKS: ${AI_MAX_CHUNKS:-4}
      COURSES_X_ACCEL_PREFIX: /_protected_courses/
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      # Uploaded SCORM packages.
      - app-storage:/var/www/html/storage/app
      # The Articulate courses are too big for an image, so they stay on the host.
      - ${COURSES_HOST_PATH:-./storage/courses}:/var/www/html/storage/courses:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-scorm_campus}
      MYSQL_USER: ${DB_USERNAME:-scorm}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # Local only, for PHP running on the host and for database clients.
      - "127.0.0.1:${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  app-storage:
  mysql-data:
