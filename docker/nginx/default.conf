server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    # Matches post_max_size in docker/php/app.ini.
    client_max_body_size 401m;
    client_body_timeout 300s;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Only the front controller runs as PHP. A .php file inside a SCORM package
    # falls through to Laravel above and is served as an inert download.
    location = /index.php {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
    }
}
